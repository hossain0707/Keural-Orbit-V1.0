# Keural Orbit — v2 FULL fine-tune (1 epoch) on google/gemma-4-26B-A4B-it.
# Uses the GENTLER recipe validated in train_orbit_v2_validate.yaml (LR 1e-5, rank 16 —
# NOT the original 5e-5/rank32, which regressed hardest), now for a full epoch, and on the
# Keural-Orbit-identity dataset (data/processed_orbit: model self-IDs as "Keural Orbit",
# with Gemma/Google de-contamination).
#
# HONEST NOTE: v1 (full epoch, aggressive) regressed benchmarks the MOST; the shorter v2
# regressed less. Going full-epoch is likely to push MCQ benchmarks DOWN further, not up.
# We save densely + keep many checkpoints so the best-performing point can be picked by
# eval — the FINAL checkpoint is not assumed to be the best.
#
#   cd "/home/work/keural MoE Pro/Keural Orbit"
#   python scripts/train.py --config configs/train_orbit_v2_full.yaml

run_name: "keural-orbit-v2-full"
output_dir: "outputs/v2_full"

nproc_per_node: 2
cuda_visible_devices: "0,1"

require_target_verification: true    # scripts/verify_lora_targets.py (Gemma-4 gate) runs first

swift_args:
  model: "google/gemma-4-26B-A4B-it"
  use_hf: true
  tuner_type: lora
  dataset: ["data/processed_orbit/train.jsonl"]      # Orbit-identity dataset
  val_dataset: ["data/processed_orbit/eval.jsonl"]

  target_regex: 'model\.language_model\.layers\.\d+\.(self_attn\.(q_proj|k_proj|v_proj|o_proj)|mlp\.(gate_proj|up_proj|down_proj))'
  target_parameters: [gate_up_proj, down_proj]
  lora_rank: 16                      # gentler than v1's 32
  lora_alpha: 32
  lora_dropout: 0.0
  freeze_vit: true
  freeze_aligner: true

  max_length: 8192
  truncation_strategy: delete
  padding_free: false
  packing: false

  torch_dtype: bfloat16
  num_train_epochs: 1                # FULL epoch (~4,500 steps); no max_steps cap
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 16    # effective batch 32
  learning_rate: 1.0e-5              # gentle (v1 used 5e-5 and regressed most)
  lr_scheduler_type: cosine
  warmup_ratio: 0.05
  weight_decay: 0.01
  max_grad_norm: 1.0
  gradient_checkpointing: true
  deepspeed: zero2
  attn_impl: sdpa

  logging_steps: 10
  save_steps: 500                    # checkpoints at 500/1000/.../4500
  eval_steps: 500
  save_total_limit: 12               # keep them ALL so eval can pick the best point
  save_only_model: false
  report_to: [tensorboard]
  seed: 42
  dataloader_num_workers: 4
