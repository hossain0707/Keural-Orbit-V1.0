# Keural Orbit — FULL SFT run on google/gemma-4-26B-A4B-it.
# All values verified against the real model + peft attach test (VERIFIED-FACTS-ORBIT.md).
# Goal: preserve base benchmarks everywhere, improve Korean only.
#
#   cd "/home/work/keural MoE Pro/Keural Orbit"
#   python scripts/train.py --config configs/train_orbit_full.yaml
# train.py runs the GEMMA safety gate (scripts/verify_lora_targets.py --pre) automatically
# before launching, and re-verifies the saved adapter after (require_target_verification).

run_name: "keural-orbit-full"
output_dir: "outputs/full"

nproc_per_node: 2
cuda_visible_devices: "0,1"

require_target_verification: true    # scripts/verify_lora_targets.py is the Gemma-4 gate

swift_args:
  model: "google/gemma-4-26B-A4B-it"
  use_hf: true                       # HF Hub, not ModelScope (verified pitfall from Nova)
  tuner_type: lora
  dataset: ["data/processed/train.jsonl"]
  val_dataset: ["data/processed/eval.jsonl"]

  # --- LoRA targeting (VERIFIED 2026-07-22, peft attach test, 0 violations) ---
  # target_regex scopes to the LANGUAGE MODEL only — a plain target_modules list
  # crashes on the vision tower's Gemma4ClippableLinear (VERIFIED-FACTS-ORBIT §3).
  target_regex: 'model\.language_model\.layers\.\d+\.(self_attn\.(q_proj|k_proj|v_proj|o_proj)|mlp\.(gate_proj|up_proj|down_proj))'
  target_parameters: [gate_up_proj, down_proj]   # 128 fused routed experts per layer
  lora_rank: 32
  lora_alpha: 64
  lora_dropout: 0.0                  # REQUIRED 0.0 — ParamWrapper crashes otherwise
  freeze_vit: true
  freeze_aligner: true

  # --- data / template ---
  max_length: 8192
  truncation_strategy: delete
  padding_free: false
  packing: false

  # --- optimization (V2 plan: 1 epoch, lower LR to protect base capability) ---
  torch_dtype: bfloat16
  num_train_epochs: 1
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 16    # effective batch 32
  learning_rate: 5.0e-5
  lr_scheduler_type: cosine
  warmup_ratio: 0.05
  weight_decay: 0.01
  max_grad_norm: 1.0
  gradient_checkpointing: true
  deepspeed: zero2
  attn_impl: sdpa

  # --- logging / checkpointing ---
  logging_steps: 10
  save_steps: 500
  eval_steps: 500
  save_total_limit: 3
  save_only_model: false
  report_to: [tensorboard]
  seed: 42
  dataloader_num_workers: 4
